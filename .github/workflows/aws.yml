name: AWS connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect-to-aws:
    name: Build and push to ECR
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      ECR_REGISTRY: 578257748163.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: mlops-deep-learning
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-actions-${{ github.run_id }}

      - name: Verify AWS connection
        run: aws sts get-caller-identity

      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push Docker image
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Image: \`$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Amazon ECR
        if: always()
        run: docker logout "$ECR_REGISTRY"
