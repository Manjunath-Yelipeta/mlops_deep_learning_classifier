name: AWS connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push-ecr-image:
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
      commit_id: ${{ steps.commit.outputs.commit_id }}
    name: Build and push to ECR
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      ECR_REGISTRY: 578257748163.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: mlops-deep-learning
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-actions-${{ github.run_id }}

      - name: Verify AWS connection
        run: aws sts get-caller-identity

      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image tag
        id: commit
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "commit_id=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push Docker image
        id: image
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image: \`$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Amazon ECR
        if: always()
        run: docker logout "$ECR_REGISTRY"

  # JOB 2: Register a Spot GPU instance as a GitHub Actions runner.
  launch-runner:
    name: Launch EC2 GPU Runner
    runs-on: ubuntu-26.04
    needs: build-and-push-ecr-image
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
      commit_id: ${{ needs.build-and-push-ecr-image.outputs.commit_id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve GPU AMI
        id: ami
        run: |
          AMI_ID=$(aws ssm get-parameter --region us-east-1 \
            --name /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-26.04/latest/ami-id \
            --query Parameter.Value --output text)
          ROOT_DEVICE=$(aws ec2 describe-images --image-ids "$AMI_ID" --owners amazon \
            --query 'Images[0].RootDeviceName' --output text)
          test -n "$ROOT_DEVICE" && test "$ROOT_DEVICE" != None
          echo "id=$AMI_ID" >> "$GITHUB_OUTPUT"
          echo "root_device=$ROOT_DEVICE" >> "$GITHUB_OUTPUT"

      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ${{ steps.ami.outputs.id }}
          ec2-instance-type: g4dn.xlarge
          subnet-id: ${{ secrets.AWS_SUBNET_ID_1 }}
          security-group-id: ${{ secrets.AWS_SECURITY_GROUP_ID }}
          market-type: spot
          block-device-mappings: >-
            [{"DeviceName":"${{ steps.ami.outputs.root_device }}","Ebs":{"VolumeSize":100,"VolumeType":"gp3","Encrypted":true,"DeleteOnTermination":true}}]
          metadata-options: '{"HttpTokens":"required","HttpEndpoint":"enabled","HttpPutResponseHopLimit":1}'
          aws-resource-tags: >-
            [{"Key":"Name","Value":"mlops-gpu-runner"},{"Key":"GitHubRunId","Value":"${{ github.run_id }}"}]
          pre-runner-script: |
            set -euo pipefail
            command -v git
            systemctl enable --now docker
            nvidia-smi
            nvidia-ctk runtime configure --runtime=docker
            systemctl restart docker

  # Replace the CUDA check with your training command when the code is ready.
  gpu-training:
    name: Verify GPU training environment
    needs: [build-and-push-ecr-image, launch-runner]
    runs-on: ${{ needs.launch-runner.outputs.label }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_URI: ${{ needs.build-and-push-ecr-image.outputs.image_uri }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Pull training image and verify CUDA
        run: |
          aws ecr get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin 578257748163.dkr.ecr.us-east-1.amazonaws.com
          docker pull "$IMAGE_URI"
          docker run --rm --gpus all "$IMAGE_URI" \
            python -c 'import torch; assert torch.cuda.is_available(), "CUDA unavailable"; print(torch.cuda.get_device_name(0))'

      - name: Log out of ECR
        if: always()
        run: docker logout 578257748163.dkr.ecr.us-east-1.amazonaws.com

  stop-runner:
    name: Remove EC2 GPU Runner
    needs: [launch-runner, gpu-training]
    if: ${{ always() && needs.launch-runner.outputs.ec2-instance-id != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.launch-runner.outputs.label }}
          ec2-instance-id: ${{ needs.launch-runner.outputs.ec2-instance-id }}
